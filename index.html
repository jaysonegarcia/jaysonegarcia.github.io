m.webp","2048x2048-width":1583,"2048x2048-height":750,"banner-scale-1920-1080":"/app/uploads/2026/08/impax-am.webp","banner-scale-1920-1080-width":1583,"banner-scale-1920-1080-height":750,"banner-crop-1920-1080":"/app/uploads/2026/08/impax-am.webp","banner-crop-1920-1080-width":1583,"banner-crop-1920-1080-height":750,"medium-600-600":"/app/uploads/2026/08/impax-am-600x600.webp","medium-600-600-width":600,"medium-600-600-height":600,"medium-413-413":"/app/uploads/2026/08/impax-am-413x413.webp","medium-413-413-width":413,"medium-413-413-height":413,"thumbnail-70-70":"/app/uploads/2026/08/impax-am-70x70.webp","thumbnail-70-70-width":70,"thumbnail-70-70-height":70,"thumbnail-5-5":"/app/uploads/2026/08/impax-am-5x5.webp","thumbnail-5-5-width":5,"thumbnail-5-5-height":5}},"frontpage_section5_projects_subfield2":"Impax Asset Management","frontpage_section5_projects_associate_with":"Copia Digital","frontpage_section5_projects_subfield4":"https://impaxam.com/","frontpage_section5_projects_enable_modal":true,"frontpage_section5_projects_description":"\u003cul style=\"margin-bottom: 0px !important; padding-bottom: 0px !important; margin-top: 0px !important; padding-top: 0px !important;\"\u003e\n\u003cli\u003eDeveloped the site end-to-end as full-stack WordPress developer, built on the modern Roots.io stack — Bedrock for project structure and Sage 11 for the theme layer.\u003c/li\u003e\n\u003cli\u003eImplemented a Composer-managed Bedrock architecture with twelve-factor configuration: environment-specific .env config, versioned plugin and core dependencies, an isolated web root, and mu-plugin autoloading for improved security and deployability.\u003c/li\u003e\n\u003cli\u003eBuilt the custom theme from scratch using Blade templating and Acorn, applying Laravel-style view composers, service providers, and component-driven partials to keep templates clean and logic out of the view layer.\u003c/li\u003e\n\u003cli\u003eBuilt a custom Gutenberg block library from scratch as pure React blocks, registered via block.json with save-based static rendering, giving the client a purpose-built set of on-brand components for composing pages.\u003c/li\u003e\n\u003cli\u003eArchitected the local development environment from scratch using Docker and Docker Compose, giving the team a consistent, reproducible setup across machines and matching the production stack.\u003c/li\u003e\n\u003cli\u003eSet up version control and CI/CD from the ground up — Git branching strategy with pull-request reviews, plus GitHub Actions workflows automating Composer and npm installs, coding-standards checks, asset compilation, and deployments to staging and production\u003c/li\u003e\n\u003cli\u003eEnforced WordPress coding standards (PHPCS/WPCS) and linting in the pipeline to keep the codebase consistent and maintainable.\u003c/li\u003e\n\u003cli\u003eBuilt dynamic, content-managed templates and custom queries so editors could manage funds, insights, events and reports without developer involvement.\u003c/li\u003e\n\u003cli\u003eIntegrated third-party APIs and data feeds, handling caching and error states for reliable front-end rendering.\u003c/li\u003e\n\u003cli\u003eOptimised performance and Core Web Vitals through asset bundling, image optimisation, and caching strategies.\u003c/li\u003e\n\u003cli\u003eDelivered responsive, cross-browser, accessibility-conscious front-end builds using Laravel Blade Template Engine, HTML5, SCSS, Tailwind CSS, React and JavaScript.\u003c/li\u003e\n\u003cli\u003eManaged plugin and core updates, security hardening, and ongoing maintenance with a regression-testing process before release.\u003c/li\u003e\n\u003cli\u003eAdopted AI-assisted development using Claude Code to accelerate delivery — scaffolding components, automating repetitive refactors, reviewing code, and generating documentation — while maintaining code quality through review and testing.\u003c/li\u003e\n\u003cli\u003eCollaborated with designers, project managers, and stakeholders through the full delivery cycle, from requirement review to release and post-launch support.\u003c/li\u003e\n\u003c/ul\u003e\n","frontpage_section5_projects_skills":"Wordpress, Roots.io Sage 11, Gutenberg, ACF, Custom Theme, React JS, Alpine JS, Javascript, GSAP, Ajax, REST API, JSON, PHP, Symfony, Laravel, Blade Template Engine, Docker, Composer.json, Vite.js, NPM, Linux, GiT, Github Action Workflow, Tailwind CSS, HTML, CSS, SCSS, MySQL, WP CLI Command"},{"frontpage_section5_projects_type":"Wordpress","frontpage_section5_projects_subfield1":{"ID":200,"id":200,"title":"premierleague-sportquake","filename":"premierleague-sportquake.webp","filesize":74170,"url":"/app/uploads/2026/08/premierleague-sportquake.webp","link":"https://jaysonegarcia.github.io/home/premierleague-sportquake/","alt":"Premier League SportQuake","author":"1","description":"","caption":"","name":"premierleague-sportquake","status":"inherit","uploaded_to":2,"date":"2026-08-23 14:15:19","modified":"2026-08-23 14:15:34","menu_order":0,"mime_type":"image/webp","type":"image","subtype":"webp","icon":"https://jaysonegarcia.github.io/wp/wp-includes/images/media/default.png","width":1645,"height":754,"sizes":{"thumbnail":"/app/uploads/2026/08/premierleague-sportquake-150x150.webp","thumbnail-width":150,"thumbnail-height":150,"medium":"/app/uploads/2026/08/premierleague-sportquake-300x138.webp","medium-width":300,"medium-height":138,"medium_large":"/app/uploads/2026/08/premierleague-sportquake-768x352.webp","medium_large-width":768,"medium_large-height":352,"large":"/app/uploads/2026/08/premierleague-sportquake-1024x469.webp","large-width":1024,"large-height":469,"1536x1536":"/app/uploads/2026/08/premierleague-sportquake-1536x704.webp","1536x1536-width":1536,"1536x1536-height":704,"2048x2048":"/app/uploads/2026/08/premierleague-sportquake.webp","2048x2048-width":1645,"2048x2048-height":754,"banner-scale-1920-1080":"/app/uploads/2026/08/premierleague-sportquake.webp","banner-scale-1920-1080-width":1645,"banner-s lities to model the firm\u0026#8217;s investor types, enforcing granular, role-based permissions server-side across page access, queries, and REST endpoints rather than relying on front-end hiding.\u003c/li\u003e\n\u003cli\u003eSecured gated document delivery so restricted reports and disclosures could not be reached by direct file URL, serving downloads through an authenticated handler with permission checks on every request.\u003c/li\u003e\n\u003cli\u003eDeveloped a custom data plugin to model and serve fund and investor data through the theme layer, keeping business logic in a versioned, testable plugin rather than embedding it in the theme.\u003c/li\u003e\n\u003cli\u003eImplemented a Composer-managed Bedrock architecture with twelve-factor configuration: environment-specific .env config, versioned plugin and core dependencies, an isolated web root, and mu-plugin autoloading for improved security and deployability.\u003c/li\u003e\n\u003cli\u003eBuilt the custom theme from scratch using Blade templating and Acorn, applying Laravel-style view composers, service providers, and component-driven partials to keep templates clean and logic out of the view layer.\u003c/li\u003e\n\u003cli\u003eArchitected the local development environment from scratch using Docker and Docker Compose, giving the team a consistent, reproducible setup across machines and matching the production stack.\u003c/li\u003e\n\u003cli\u003eSet up version control and CI/CD from the ground up — Git branching strategy with pull-request reviews, plus GitHub Actions workflows automating Composer and npm installs, coding-standards checks, asset compilation, and deployments to staging and production\u003c/li\u003e\n\u003cli\u003eEnforced WordPress coding standards (PHPCS/WPCS) and linting in the pipeline to keep the codebase consistent and maintainable.\u003c/li\u003e\n\u003cli\u003eBuilt dynamic, content-managed templates and custom queries so editors could manage funds, insights, and reports without devel ontpage_section5_projects_subfield2":"TheOne","frontpage_section5_projects_associate_with":"Halcyon Digital Media Design, Inc.","frontpage_section5_projects_subfield4":"https://theone.com.ph/","frontpage_section5_projects_enable_modal":false,"frontpage_section5_projects_description":"\u003cul style=\"margin-bottom: 0px !important; padding-bottom: 0px !important; margin-top: 0px !important; padding-top: 0px !important;\"\u003e\n\u003cli\u003eBuilt and delivered the site solo as sole developer.\u003c/li\u003e\n\u003cli\u003eDeveloped the site on Bedrock with Composer-managed core, plugins, and dependencies, .env-based configuration, an isolated web root, and bcrypt password hashing — applying modern, secure WordPress architecture rather than a stock installation.\u003c/li\u003e\n\u003cli\u003eBuilt the front end on a custom WordPress starter theme of my own authorship, structured with modular SASS, Bootstrap 4, and a Gulp build pipeline handling compilation, autoprefixing and minification.\u003c/li\u003e\n\u003cli\u003eDeveloped reusable theme architecture with separated concerns — setup, filters, template tags, shortcodes, AJAX handlers, custom widgets, and customiser fields — keeping functions.php clean and the codebase maintainable.\u003c/li\u003e\n\u003cli\u003eImplemented a theme options layer with Kirki so the client could control header, footer, and sidebar configuration without touching code.\u003c/li\u003e\n\u003cli\u003eBuilt AJAX-driven form handling with Contact Form 7 and reCAPTCHA, including custom loading states for a smoother submission experience.\u003c/li\u003e\n\u003cli\u003eTailored the WordPress admin for the client — custom login branding, refined role capabilities and media permissions, a decluttered admin bar, and repositioned SEO controls — reducing the chance of editors breaking the site.\u003c/li\u003e\n\u003cli\u003eConfigured performance infrastructure with page caching, asset optimisation, and automated image compression.\u003c/li\u003e\n
